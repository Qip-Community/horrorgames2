<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Не нажимай</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран 1: Приветствие -->
    <div id="screen-intro" class="screen active">
        <h1 class="glitch" data-text="Ты уверен?">Ты уверен?</h1>
        <p class="subtitle">Некоторые вещи лучше не открывать.</p>
        <button id="btn-start" class="creepy-btn">Я готов</button>
        <p class="hint">🔊 Включи звук. Разреши камеру. Не оглядывайся.</p>
    </div>

    <!-- Экран 2: Разрешение камеры -->
    <div id="screen-permission" class="screen">
        <h2>Разреши доступ к камере</h2>
        <p>Мы просто хотим <span class="red">посмотреть на тебя</span>.</p>
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="scanline"></div>
        </div>
        <div class="btn-row">
            <button id="btn-allow" class="creepy-btn">Разрешить</button>
            <button id="btn-deny" class="creepy-btn ghost">Отказать</button>
        </div>
    </div>

    <!-- Экран 3: Основной хоррор -->
    <div id="screen-game" class="screen">
        <div class="video-wrapper fullscreen-video">
            <video id="webcam-bg" autoplay playsinline muted></video>
            <div class="overlay-dark"></div>
            <div class="scanline"></div>
            <div class="noise"></div>
        </div>

        <!-- Оверлей с распознаванием лиц -->
        <canvas id="face-canvas"></canvas>

        <div id="message-container">
            <p id="message" class="message-text"></p>
            <p id="status" class="status-text"></p>
        </div>

        <!-- Прогресс-бар "времени до конца" -->
        <div id="timer-bar"><div id="timer-fill"></div></div>
    </div>

    <!-- Экран 4: Финал -->
    <div id="screen-end" class="screen">
        <h1 class="glitch" data-text="Я тебя запомнил">Я тебя запомнил</h1>
        <p class="subtitle">До следующего раза...</p>
        <p id="end-stats" class="stats"></p>
        <button id="btn-restart" class="creepy-btn">Начать заново</button>
    </div>

    <!-- Загрузка моделей -->
    <div id="loader" class="loader">
        <p>Загрузка моделей распознавания...</p>
        <div class="loader-bar"><div id="loader-fill"></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="audio.js"></script>
    <script src="face.js"></script>
    <script src="script.js"></script>
</body>
</html>
